<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShadeRoute - Bright Shadow Polygon v3</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <style>
    html,body,#cesiumContainer{width:100%;height:100%;margin:0;padding:0;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.panel{position:absolute;z-index:10;top:12px;left:12px;width:430px;max-height:calc(100vh - 24px);overflow:auto;background:rgba(15,23,42,.93);color:white;border-radius:16px;padding:14px;box-shadow:0 14px 36px rgba(0,0,0,.35)}.panel h1{font-size:20px;margin:2px 0 8px}.eyebrow{font-size:11px;color:#93c5fd}.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;margin:10px 0}.card h2{font-size:14px;margin:0 0 8px;color:#bfdbfe}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}label{display:block;font-size:12px;color:#dbeafe}input,select,textarea{width:100%;box-sizing:border-box;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.09);color:white;padding:7px;margin-top:4px}textarea{min-height:54px}.buttonRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}button{border:0;border-radius:999px;padding:8px 12px;cursor:pointer;background:#334155;color:white;font-weight:700}.primary{background:#2563eb}.hint,.subtle{font-size:12px;color:#cbd5e1;line-height:1.45}.statusBox{font-size:12px;white-space:pre-wrap;background:rgba(0,0,0,.22);border-radius:10px;padding:8px;margin-top:8px;color:#e2e8f0}.legend{position:absolute;right:12px;bottom:12px;z-index:10;background:rgba(15,23,42,.88);color:white;padding:10px;border-radius:12px}.b{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px}.sun{background:#ef4444}.shade{background:#2563eb}.detail{position:absolute;right:12px;top:12px;z-index:10;width:360px;max-height:calc(100vh - 90px);overflow:auto;background:rgba(15,23,42,.92);color:white;border-radius:14px;padding:12px;display:none}.detail pre{white-space:pre-wrap;font-size:11px;background:rgba(255,255,255,.08);padding:8px;border-radius:8px}.shadowPanel{position:absolute;z-index:11;right:12px;bottom:72px;width:350px;background:rgba(15,23,42,.92);color:white;padding:12px;border-radius:14px;font-size:12px;box-shadow:0 12px 30px rgba(0,0,0,.32)}.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;background:rgba(15,23,42,.95);color:white;border-radius:999px;padding:9px 14px;display:none}
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <aside class="panel">
    <div class="eyebrow">ShadeRoute × PLATEAU × ORS</div><h1>日陰優先ルート検索</h1>
    <section class="card"><div id="clockLabel">--</div><div id="sunLabel" class="subtle">太陽高度 --° / 方位 --°</div><div id="appStatus" class="statusBox">起動中...</div></section>
    <section class="card"><h2>1. API接続</h2><label>Cloudflare Worker URL<input id="workerUrl" placeholder="https://xxxx.workers.dev" /></label><div class="buttonRow"><button id="saveWorkerBtn">保存</button><button id="healthBtn">接続テスト</button></div><p id="healthText" class="hint">Worker URLは /routes や /health を付けないでください。</p></section>
    <section class="card grid2"><label>出発地<input id="originInput" value="35.681236,139.767125" /></label><label>目的地<input id="destinationInput" value="35.674510,139.758101" /></label><label>移動手段<select id="travelMode"><option value="foot-walking">徒歩</option><option value="cycling-regular">自転車</option><option value="driving-car">車</option></select></label><label>優先度<select id="routeMode"><option>バランス</option><option>日陰優先</option></select></label><label>日付<input id="dateInput" type="date" /></label><label>時刻<input id="timeInput" type="time" step="60" /></label></section>
    <section class="card"><div class="buttonRow"><button id="searchBtn" class="primary">日陰ルート検索</button><button id="recalcBtn">時刻だけ再判定</button></div></section>
    <section class="card"><h2>2. PLATEAU建物</h2><label>プリセット<select id="plateauPreset"><option value="13101-lod1-latest" selected>千代田区 LOD1 latest</option><option value="13-lod1-latest">東京都 LOD1 latest</option><option value="all-lod1-latest">全国 LOD1 latest</option><option value="13101-maxlod2-latest">千代田区 maxLOD2 latest</option><option value="custom">カスタム</option></select></label><div class="grid3"><label>範囲<input id="cityCodeInput" value="13101" /></label><label>LOD<select id="lodInput"><option value="lod1" selected>lod1</option><option value="maxlod2">maxlod2</option><option value="lod2">lod2</option></select></label><label>年度<input id="yearInput" value="latest" /></label></div><label>texture<select id="textureInput"><option value="" selected>自動</option><option value="texture">texture</option><option value="notexture">notexture</option></select></label><label>PLATEAU URL<textarea id="plateauUrlInput"></textarea></label><div class="buttonRow"><button id="applyPlateauUrlBtn">URL反映</button><button id="loadPlateauBtn" class="primary">PLATEAU読込</button><button id="clearPlateauBtn">建物クリア</button></div><p id="plateauStatus" class="hint"></p></section>
    <section class="card"><h2>3. Terrain</h2><label>Cesium ion Token<input id="cesiumToken" type="password" /></label><div class="grid2"><label>Terrain Asset ID<input id="terrainAssetId" value="2767062" /></label><label>地形<select id="terrainMode"><option value="ion" selected>Japan Regional Terrain</option><option value="ellipsoid">地形なし</option></select></label></div><div class="buttonRow"><button id="saveCesiumTokenBtn">Token保存</button><button id="applyTerrainBtn" class="primary">Terrain適用</button><button id="clearTerrainBtn">地形OFF</button></div><p id="terrainStatus" class="hint"></p></section>
    <section class="card"><h2>4. 判定設定</h2><div class="grid2"><label>サンプル間隔m<input id="sampleStep" type="number" value="10" /></label><label>最大点数<input id="maxSamples" type="number" value="500" /></label><label>左右幅m<input id="sideOffsetMeters" type="number" value="4" step="0.5" /></label><label>横点<select id="lateralMode"><option value="5" selected>5</option><option value="3">3</option><option value="1">1</option></select></label><label>高さ<select id="heightMode"><option value="3" selected>3高さ</option><option value="1">1.7mのみ</option></select></label><label>しきい値%<input id="shadeThreshold" type="number" value="45" /></label><label>タイル待機ms<input id="tileWaitMs" type="number" value="1800" /></label><label>線幅px<input id="overlayWidth" type="number" value="10" /></label></div></section>
    <section class="card"><h2>5. 結果</h2><div id="results" class="hint">未検索</div></section>
  </aside>
  <aside id="detail" class="detail"><h2>サンプル詳細</h2><pre id="detailText"></pre></aside>
  <aside class="shadowPanel"><b>影表示: 明るさ維持 + 地面ポリゴン</b><div class="grid2" style="margin-top:8px"><label>格子m<input id="shadowPlusStep" type="number" value="8" /></label><label>範囲m<input id="shadowPlusBuffer" type="number" value="90" /></label><label>高さm<input id="shadowPlusHeight" type="number" value="0.2" step="0.1" /></label><label>待機ms<input id="shadowPlusTileWait" type="number" value="1600" /></label><label>ポリゴン色<select id="shadowPolygonColor"><option value="black" selected>黒</option><option value="blue">青</option></select></label><label>濃さ<input id="shadowPolygonAlpha" type="number" value="0.42" min="0.05" max="0.95" step="0.05" /></label></div><div class="buttonRow"><button id="visualShadowOnBtn">見た目影ON</button><button id="visualShadowOffBtn">見た目影OFF</button><button id="generateShadowPlusBtn" class="primary">建物影ポリゴン生成</button><button id="clearShadowPlusBtn">ポリゴンクリア</button></div><div id="shadowPlusStatus" class="statusBox">18時でも全体暗転しない設定です。PLATEAU読込・ルート検索後に生成してください。</div></aside>
  <div class="legend"><span><b class="b sun"></b>日なた</span> <span><b class="b shade"></b>日陰</span></div><div id="toast" class="toast"></div><script src="./app.js?v=bright-shadow-v3"></script>
</body></html>
