<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShadeRoute Diagnostic Bootstrap</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <style>
    html, body, #cesiumContainer { width:100%; height:100%; margin:0; padding:0; overflow:hidden; }
    #diagPanel { position:absolute; z-index:9999; top:12px; left:12px; width:420px; max-width:calc(100vw - 24px); background:rgba(15,23,42,.94); color:#fff; border-radius:14px; padding:14px; font-family:system-ui,sans-serif; box-shadow:0 12px 32px rgba(0,0,0,.35); }
    #diagPanel h1 { margin:0 0 8px; font-size:18px; }
    #appStatus { white-space:pre-wrap; font-size:13px; line-height:1.5; background:rgba(255,255,255,.08); border-radius:10px; padding:10px; }
    button { border:0; border-radius:999px; padding:8px 12px; background:#2563eb; color:white; font-weight:700; margin-top:10px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="diagPanel">
    <h1>ShadeRoute 起動診断</h1>
    <div id="appStatus">HTMLは読み込まれました。app.jsを起動中...</div>
    <button id="reloadBtn" type="button">キャッシュ無視で再読込</button>
  </div>
  <script src="./app.js?v=diagnostic-20260609-1539"></script>
</body>
</html>
