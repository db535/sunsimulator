<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShadeRoute - Cesium Ray Direction / Road Shadow Debug</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #panel {
      position: absolute; z-index: 10; top: 12px; left: 12px; width: 390px; max-height: calc(100vh - 24px);
      overflow: auto; background: rgba(18, 24, 38, 0.92); color: #fff; border-radius: 14px;
      box-shadow: 0 12px 34px rgba(0,0,0,.35); padding: 14px; backdrop-filter: blur(8px);
    }
    #panel h1 { font-size: 18px; margin: 0 0 10px; }
    #panel h2 { font-size: 14px; margin: 14px 0 8px; color: #bfdbfe; }
    #panel label { display: block; font-size: 12px; color: #dbeafe; margin: 8px 0 4px; }
    #panel input, #panel select, #panel textarea {
      width: 100%; box-sizing: border-box; border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08); color: #fff; border-radius: 8px; padding: 7px 8px;
      outline: none;
    }
    #panel textarea { min-height: 48px; resize: vertical; }
    #panel input::placeholder, #panel textarea::placeholder { color: #94a3b8; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button {
      border: 0; border-radius: 999px; padding: 8px 12px; color: #fff; cursor: pointer;
      background: #2563eb; font-weight: 700; box-shadow: 0 4px 14px rgba(37,99,235,.28);
    }
    button.secondary { background: #334155; box-shadow: none; }
    button.warn { background: #b45309; box-shadow: none; }
    button:disabled { opacity: .55; cursor: wait; }
    .muted { color: #cbd5e1; font-size: 12px; line-height: 1.45; }
    .status { margin-top: 10px; padding: 8px; border-radius: 10px; background: rgba(255,255,255,.08); font-size: 12px; white-space: pre-wrap; }
    .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; margin-top: 8px; }
    .chip { display:inline-flex; align-items:center; gap:5px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display:inline-block; }
    #detail {
      position: absolute; right: 12px; top: 12px; z-index: 10; width: 340px; max-height: calc(100vh - 24px);
      overflow: auto; background: rgba(15, 23, 42, .92); color: #fff; border-radius: 14px; padding: 12px;
      box-shadow: 0 12px 34px rgba(0,0,0,.35); display: none;
    }
    #detail h2 { font-size: 16px; margin: 0 0 8px; }
    #detail pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; background: rgba(255,255,255,.08); padding:8px; border-radius: 8px; }
    .smallcheck { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:#dbeafe; }
    .smallcheck input { width:auto !important; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <section id="panel">
    <h1>ShadeRoute - C/E 修正版</h1>
    <p class="muted">
      C: レイ方向を「地点→太陽方向」に固定。<br>
      E: 点判定だけでなく、道路面へ青/赤の判定影オーバーレイを投影表示。
    </p>

    <h2>Cesium / データ</h2>
    <label>Cesium ion Token</label>
    <input id="ionToken" type="password" placeholder="Cesium ion token" />
    <div class="buttons">
      <button id="saveTokenBtn" class="secondary">Token保存</button>
      <button id="applyTerrainBtn" class="secondary">Japan Regional Terrain適用</button>
    </div>

    <label>PLATEAU建物 3D Tiles / ion Asset ID または tileset.json URL（カンマ区切り）</label>
    <textarea id="buildingSources" placeholder="例: 1234567 または https://.../tileset.json"></textarea>
    <div class="buttons">
      <button id="loadBuildingsBtn" class="secondary">建物読込</button>
      <button id="clearBuildingsBtn" class="secondary">建物クリア</button>
    </div>

    <h2>ルート</h2>
    <label>Cloudflare Worker URL</label>
    <input id="workerUrl" placeholder="https://your-worker.workers.dev" />
    <div class="row">
      <div><label>開始 lng,lat</label><input id="startCoord" placeholder="139.767125,35.681236" /></div>
      <div><label>終了 lng,lat</label><input id="endCoord" placeholder="139.758101,35.674510" /></div>
    </div>
    <div class="row">
      <div><label>ORS profile</label><select id="profile"><option value="foot-walking">foot-walking</option><option value="driving-car">driving-car</option><option value="cycling-regular">cycling-regular</option></select></div>
      <div><label>日時</label><input id="dateTime" type="datetime-local" /></div>
    </div>

    <h2>影判定</h2>
    <div class="row3">
      <div><label>間隔 m</label><input id="sampleStep" type="number" value="10" min="2" step="1" /></div>
      <div><label>最大点数</label><input id="maxSamples" type="number" value="500" min="20" step="10" /></div>
      <div><label>タイル待機 ms</label><input id="tileWait" type="number" value="1800" min="0" step="100" /></div>
    </div>
    <div class="row3">
      <div><label>左右幅 m</label><input id="sideWidth" type="number" value="4" min="0" step="0.5" /></div>
      <div><label>横点数</label><input id="sideCount" type="number" value="5" min="1" max="9" step="2" /></div>
      <div><label>しきい値 %</label><input id="shadeThreshold" type="number" value="45" min="1" max="100" step="1" /></div>
    </div>
    <label>高さ m（カンマ区切り）</label>
    <input id="heightList" value="0.2,1.0,1.7" />
    <div class="row">
      <div><label>道路面オーバーレイ幅 m</label><input id="overlayWidth" type="number" value="9" min="2" step="0.5" /></div>
      <div><label>最大レイ距離 m</label><input id="maxRayDistance" type="number" value="1500" min="50" step="50" /></div>
    </div>

    <label class="smallcheck"><input id="showDebugPoints" type="checkbox" checked /> 横点×高さのデバッグ点を表示</label>
    <label class="smallcheck"><input id="showRoadOverlay" type="checkbox" checked /> 道路面に青/赤オーバーレイを表示</label>
    <label class="smallcheck"><input id="showSunRayOnClick" type="checkbox" checked /> クリック点から太陽方向レイを表示</label>

    <div class="buttons">
      <button id="runBtn">ルート取得 → 日陰判定</button>
      <button id="clearBtn" class="secondary">結果クリア</button>
      <button id="visualShadowBtn" class="warn">見た目の影プレビュー切替</button>
    </div>

    <div class="legend">
      <span class="chip"><span class="dot" style="background:#2563eb"></span>日陰</span>
      <span class="chip"><span class="dot" style="background:#ef4444"></span>日なた</span>
      <span class="chip"><span class="dot" style="background:#f8fafc"></span>判定点</span>
      <span class="chip"><span class="dot" style="background:#facc15"></span>太陽方向レイ</span>
    </div>
    <div id="status" class="status">準備中...</div>
  </section>

  <aside id="detail">
    <h2>サンプル詳細</h2>
    <pre id="detailText"></pre>
  </aside>

  <script src="./app.js"></script>
</body>
</html>
