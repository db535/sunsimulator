<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShadeRoute - Maps UI v3 Simple Shadows</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <style>
    :root{--card:rgba(255,255,255,.96);--ink:#0f172a;--muted:#64748b;--blue:#2563eb;--shadow:0 18px 45px rgba(15,23,42,.22)}
    html,body,#cesiumContainer{width:100%;height:100%;margin:0;padding:0;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#e5e7eb}.cesium-viewer-bottom{display:none!important}
    .topSearch{position:absolute;z-index:20;top:14px;left:14px;width:min(460px,calc(100vw - 28px));background:var(--card);color:var(--ink);border-radius:28px;box-shadow:var(--shadow);padding:10px 12px;display:flex;align-items:center;gap:10px}.hamb{width:38px;height:38px;border:0;background:#f1f5f9;border-radius:50%;font-size:20px;cursor:pointer}.searchMain{flex:1;border:0;outline:0;background:transparent;font-size:15px;color:var(--ink)}.dirBtn{border:0;background:var(--blue);color:white;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}
    .directionsPanel{position:absolute;z-index:19;top:76px;left:14px;width:min(460px,calc(100vw - 28px));max-height:calc(100vh - 96px);overflow:auto;background:var(--card);color:var(--ink);border-radius:22px;box-shadow:var(--shadow);padding:14px}.directionsPanel.collapsed{display:none}.inputLine{display:grid;grid-template-columns:24px 1fr 36px;align-items:center;gap:8px;margin:8px 0}.bullet{width:10px;height:10px;border-radius:50%;margin:auto}.green{background:#22c55e}.red{background:#ef4444}.placeInput{width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:14px;background:#f8fafc;color:#0f172a;padding:12px 13px;font-size:14px;outline:none}.placeInput:focus{border-color:#93c5fd;background:#fff}.iconBtn{border:0;background:#f1f5f9;border-radius:12px;width:36px;height:36px;cursor:pointer}.modeRow{display:flex;gap:8px;margin:12px 0}.mode{border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer;color:#334155}.mode.active{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe;font-weight:800}.primary{background:#2563eb!important;color:white!important;border-color:#2563eb!important;font-weight:800}.warn{background:#0f172a!important;color:white!important;border-color:#0f172a!important;font-weight:800}.subtle{font-size:12px;color:var(--muted)}.mini{font-size:11px;color:#64748b;white-space:pre-wrap}.panelBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.panelBtns button{border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer;color:#334155}.advanced{margin-top:12px;border-top:1px solid #e2e8f0;padding-top:12px;display:none}.advanced.open{display:block}.quickLoad{background:#f8fafc;border:1px solid #e2e8f0;border-radius:18px;padding:10px;margin:10px 0}.quickLoad b{display:block;margin-bottom:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}label{font-size:12px;color:#475569}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:12px;background:#fff;color:#0f172a;padding:8px;margin-top:4px}textarea{min-height:50px}.statusBox{white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:9px;color:#334155;font-size:12px;margin-top:10px}.quickChips{display:flex;gap:8px;overflow:auto;margin:10px 0 2px}.chip{border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;cursor:pointer;white-space:nowrap;color:#334155}.chip:hover{background:#f8fafc}
    .rightControls{position:absolute;z-index:18;right:14px;top:90px;display:flex;flex-direction:column;gap:10px}.roundCtl{width:44px;height:44px;border:0;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:18px;cursor:pointer;color:#0f172a}.bottomSheet{position:absolute;z-index:17;left:50%;bottom:14px;transform:translateX(-50%);width:min(760px,calc(100vw - 28px));background:var(--card);color:var(--ink);border-radius:24px;box-shadow:var(--shadow);padding:14px;display:none}.bottomSheet.open{display:block}.routeTitle{font-weight:900;font-size:16px}.routeStats{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.stat{background:#f8fafc;border-radius:14px;padding:8px 10px;font-size:13px}.toast{position:absolute;z-index:40;left:50%;bottom:22px;transform:translateX(-50%);background:#0f172a;color:white;border-radius:999px;padding:10px 16px;display:none}.detail{position:absolute;z-index:22;right:14px;top:14px;width:360px;max-height:calc(100vh - 28px);overflow:auto;background:rgba(15,23,42,.94);color:white;border-radius:18px;padding:12px;display:none}.detail pre{white-space:pre-wrap;background:rgba(255,255,255,.08);border-radius:12px;padding:10px;font-size:11px}.legend{position:absolute;z-index:16;right:14px;bottom:14px;background:rgba(15,23,42,.88);color:white;border-radius:999px;padding:9px 12px;font-size:12px}.b{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 4px -1px 8px}.sun{background:#ef4444}.shade{background:#2563eb}@media(max-width:760px){.bottomSheet{bottom:8px}.directionsPanel{max-height:65vh}}
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div class="topSearch"><button id="menuBtn" class="hamb" title="設定">☰</button><input id="globalSearch" class="searchMain" placeholder="場所を検索、または目的地を入力" /><button id="directionsToggle" class="dirBtn">経路</button></div>
  <aside id="directionsPanel" class="directionsPanel">
    <div class="inputLine"><span class="bullet green"></span><input id="originInput" class="placeInput" value="35.681236,139.767125" placeholder="出発地" /><button id="useHereBtn" class="iconBtn" title="現在地">⌖</button></div>
    <div class="inputLine"><span class="bullet red"></span><input id="destinationInput" class="placeInput" value="35.674510,139.758101" placeholder="目的地" /><button id="swapBtn" class="iconBtn" title="入替">⇅</button></div>
    <div class="modeRow"><button data-mode="foot-walking" class="mode active">徒歩</button><button data-mode="cycling-regular" class="mode">自転車</button><button data-mode="driving-car" class="mode">車</button></div><input id="travelMode" type="hidden" value="foot-walking" />
    <div class="grid2"><label>日付<input id="dateInput" type="date" /></label><label>時刻<input id="timeInput" type="time" step="60" /></label></div>
    <div class="quickLoad"><b>3D建物 / 影</b><div class="panelBtns"><button id="loadPlateauQuickBtn" class="warn">3D建物読込</button><button id="generateShadowBtn">影生成</button><button id="clearPlateauBtnTop">建物クリア</button></div><div class="subtle">影ポリゴン機能は削除済み。Cesiumの見た目影のみ生成します。</div></div>
    <div class="quickChips"><button class="chip" data-o="東京駅" data-d="日比谷公園">東京駅→日比谷公園</button><button class="chip" data-o="東京駅" data-d="銀座駅">東京駅→銀座</button><button class="chip" data-o="大手町駅" data-d="有楽町駅">大手町→有楽町</button></div>
    <div class="panelBtns"><button id="searchBtn" class="primary">日陰ルート検索</button><button id="recalcBtn">時刻だけ再判定</button><button id="advancedToggle">詳細設定</button></div>
    <div id="appStatus" class="statusBox">起動中...</div>
    <div id="advanced" class="advanced">
      <h3 style="margin:0 0 8px;font-size:14px">API / Terrain / PLATEAU</h3>
      <label>Cloudflare Worker URL<input id="workerUrl" placeholder="https://xxxx.workers.dev" /></label><div class="panelBtns"><button id="saveWorkerBtn">Worker保存</button><button id="healthBtn">接続テスト</button></div><div id="healthText" class="mini"></div>
      <label>Cesium ion Token<input id="cesiumToken" type="password" /></label><div class="grid2"><label>Terrain Asset ID<input id="terrainAssetId" value="2767062" /></label><label>地形<select id="terrainMode"><option value="ion" selected>Japan Regional Terrain</option><option value="ellipsoid">地形なし</option></select></label></div><div class="panelBtns"><button id="saveCesiumTokenBtn">Token保存</button><button id="applyTerrainBtn">Terrain適用</button><button id="clearTerrainBtn">地形OFF</button></div><div id="terrainStatus" class="mini"></div>
      <label>PLATEAUプリセット<select id="plateauPreset"><option value="13101-lod1-latest" selected>千代田区 LOD1 latest</option><option value="13-lod1-latest">東京都 LOD1 latest</option><option value="all-lod1-latest">全国 LOD1 latest</option><option value="13101-maxlod2-latest">千代田区 maxLOD2 latest</option><option value="custom">カスタム</option></select></label><div class="grid3"><label>範囲<input id="cityCodeInput" value="13101" /></label><label>LOD<select id="lodInput"><option value="lod1" selected>lod1</option><option value="maxlod2">maxlod2</option><option value="lod2">lod2</option></select></label><label>年度<input id="yearInput" value="latest" /></label></div><label>texture<select id="textureInput"><option value="" selected>自動</option><option value="texture">texture</option><option value="notexture">notexture</option></select></label><label>PLATEAU URL<textarea id="plateauUrlInput"></textarea></label><div class="panelBtns"><button id="applyPlateauUrlBtn">URL反映</button><button id="loadPlateauBtn">PLATEAU読込</button><button id="clearPlateauBtn">建物クリア</button></div><div id="plateauStatus" class="mini"></div>
      <h3 style="margin:12px 0 8px;font-size:14px">日陰判定</h3><div class="grid2"><label>サンプル間隔m<input id="sampleStep" type="number" value="10" /></label><label>最大点数<input id="maxSamples" type="number" value="500" /></label><label>左右幅m<input id="sideOffsetMeters" type="number" value="4" step="0.5" /></label><label>横点<select id="lateralMode"><option value="5" selected>5</option><option value="3">3</option><option value="1">1</option></select></label><label>高さ<select id="heightMode"><option value="3" selected>3高さ</option><option value="1">1.7mのみ</option></select></label><label>しきい値%<input id="shadeThreshold" type="number" value="45" /></label><label>タイル待機ms<input id="tileWaitMs" type="number" value="1800" /></label><label>線幅px<input id="overlayWidth" type="number" value="10" /></label></div>
    </div>
  </aside>
  <div class="rightControls"><button id="zoomInBtn" class="roundCtl">＋</button><button id="zoomOutBtn" class="roundCtl">－</button><button id="locateBtn" class="roundCtl">⌖</button><button id="shadowBtn" class="roundCtl">☀</button></div>
  <section id="bottomSheet" class="bottomSheet"><div class="routeTitle">ルート結果</div><div id="results" class="routeStats"><span class="stat">未検索</span></div></section>
  <aside id="detail" class="detail"><h2>サンプル詳細</h2><pre id="detailText"></pre></aside><div class="legend"><span><b class="b sun"></b>日なた</span><span><b class="b shade"></b>日陰</span></div><div id="toast" class="toast"></div><script src="./app.js?v=maps-ui-v3-simple-shadow"></script>
</body>
</html>
