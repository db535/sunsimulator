<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ShadeRoute rollback - bright shadow polygon v3</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    html,body,#cesiumContainer{width:100%;height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#111}.cesium-viewer-bottom{display:none!important}
    #panel{position:absolute;z-index:20;left:12px;top:12px;width:390px;max-height:calc(100vh - 24px);overflow:auto;background:rgba(15,23,42,.92);color:#fff;border-radius:16px;padding:14px;box-shadow:0 14px 40px #0007}h1{font-size:18px;margin:0 0 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}label{font-size:12px;color:#cbd5e1}input,select,textarea,button{box-sizing:border-box;width:100%;border:1px solid #334155;border-radius:10px;background:#0f172a;color:#fff;padding:8px;margin:4px 0 8px}textarea{min-height:54px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{width:auto;min-width:110px;background:#1d4ed8;border-color:#2563eb;font-weight:700;cursor:pointer}.buttons button.secondary{background:#334155;border-color:#475569}.buttons button.warn{background:#b45309;border-color:#d97706}.status{white-space:pre-wrap;background:#020617;border:1px solid #334155;border-radius:10px;padding:8px;font-size:12px;color:#dbeafe;margin-top:8px}.legend{position:absolute;right:12px;bottom:12px;z-index:15;background:rgba(15,23,42,.88);color:white;border-radius:999px;padding:9px 12px;font-size:12px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 4px -1px 10px}.blue{background:#2563eb}.red{background:#ef4444}.black{background:#000}
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="panel">
    <h1>ShadeRoute rollback</h1>
    <label>Cloudflare Worker URL<input id="workerUrl" placeholder="https://xxxx.workers.dev"></label>
    <div class="row"><label>出発地 lat,lng<input id="startInput" value="35.681236,139.767125"></label><label>目的地 lat,lng<input id="endInput" value="35.674510,139.758101"></label></div>
    <div class="row"><label>日付<input id="dateInput" type="date"></label><label>時刻<input id="timeInput" type="time" step="60"></label></div>
    <div class="row"><label>移動手段<select id="profile"><option value="foot-walking">徒歩</option><option value="cycling-regular">自転車</option><option value="driving-car">車</option></select></label><label>線幅px<input id="lineWidth" type="number" value="10"></label></div>
    <h3>Cesium / Terrain / PLATEAU</h3>
    <label>Cesium ion Token<input id="cesiumToken" type="password"></label>
    <div class="row"><label>Terrain Asset ID<input id="terrainAssetId" value="2767062"></label><label>地形<select id="terrainMode"><option value="ion">Japan Regional Terrain</option><option value="ellipsoid">地形なし</option></select></label></div>
    <label>PLATEAU 3D Tiles URL<textarea id="plateauUrl">https://api.plateauview.mlit.go.jp/datacatalog/3dtiles/13101-bldg-lod1-latest/tileset.json</textarea></label>
    <h3>日陰判定</h3>
    <div class="row3"><label>サンプル間隔m<input id="sampleStep" type="number" value="10"></label><label>最大点数<input id="maxSamples" type="number" value="500"></label><label>待機ms<input id="tileWaitMs" type="number" value="1800"></label></div>
    <div class="row3"><label>閾値%<input id="shadeThreshold" type="number" value="45"></label><label>高さ<select id="heightMode"><option value="3">3高さ</option><option value="1">1.7mのみ</option></select></label><label>地面影格子m<input id="shadowGrid" type="number" value="8"></label></div>
    <div class="buttons"><button id="saveBtn" class="secondary">設定保存</button><button id="applyTerrainBtn">Terrain適用</button><button id="loadPlateauBtn">PLATEAU読込</button><button id="clearPlateauBtn" class="secondary">建物クリア</button><button id="searchBtn">日陰ルート検索</button><button id="visualShadowBtn">見た目影ON</button><button id="groundShadowBtn" class="warn">地面影ポリゴン生成</button><button id="clearBtn" class="secondary">表示クリア</button></div>
    <div id="status" class="status">起動中...</div>
  </div>
  <div class="legend"><span class="dot blue"></span>日陰 <span class="dot red"></span>日なた <span class="dot black"></span>地面影</div>
  <script src="./app.js?v=rollback-bright-shadow-polygon-v3-reissued"></script>
</body>
</html>
